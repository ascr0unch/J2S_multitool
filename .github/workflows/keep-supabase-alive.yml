#auto wakeup pour supabase et éviter qu'ils le désactive
name: Keep Supabase Alive

on:
  schedule:
    # Tous les 6 jours à 00h00 UTC
    - cron: '0 0 */6 * *'
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (J2S)
        env:
          J2S_SUPABASE_URL: ${{ secrets.J2S_SUPABASE_URL }}
          J2S_SUPABASE_ANON_KEY: ${{ secrets.J2S_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS \
            -H "apikey: $J2S_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $J2S_SUPABASE_ANON_KEY" \
            "$J2S_SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1"
          echo "✅ Supabase J2S pinged successfully"
